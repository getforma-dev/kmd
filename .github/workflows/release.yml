name: Release

# Tests run on every push to main and on pull requests, so a regression is
# caught long before release. Building and publishing happen only for a tag,
# and only after the tests pass.
on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build client
        shell: bash
        run: bash build-client.sh

      - name: Unit tests
        run: cargo test

      # The e2e suite drives the real binary, so it needs a release build.
      - name: Build binary
        run: cargo build --release

      - name: Install Playwright browser
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  build:
    # Only tags publish; pushes to main and PRs stop after `test`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            npm-pkg: kmd-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            npm-pkg: kmd-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm-pkg: kmd-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            npm-pkg: kmd-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm-pkg: kmd-win32-x64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write  # Required for npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build client
        run: |
          npm install
          bash build-client.sh

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p npm/${{ matrix.npm-pkg }}/bin
          cp target/${{ matrix.target }}/release/kmd \
             npm/${{ matrix.npm-pkg }}/bin/kmd
          chmod +x npm/${{ matrix.npm-pkg }}/bin/kmd

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p npm/${{ matrix.npm-pkg }}/bin
          cp target/${{ matrix.target }}/release/kmd.exe \
             npm/${{ matrix.npm-pkg }}/bin/kmd.exe

      - name: Verify version matches tag
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./npm/${{ matrix.npm-pkg }}/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      # Trusted publishing: uses OIDC for auth, no npm token needed.
      # Provenance is generated automatically.
      # Configure at: npmjs.com → package Settings → Trusted Publisher
      - name: Publish platform package
        working-directory: npm/${{ matrix.npm-pkg }}
        run: npm publish --access public --provenance

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm-pkg }}
          path: npm/${{ matrix.npm-pkg }}/bin/

  publish-meta:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for GitHub Release
      id-token: write  # Required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./npm/kmd/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Copy README into npm package
        run: cp README.md npm/kmd/README.md

      # Trusted publishing: uses OIDC for auth, no npm token needed.
      # Provenance is generated automatically.
      # Configure at: npmjs.com → package Settings → Trusted Publisher
      - name: Publish meta package
        working-directory: npm/kmd
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
