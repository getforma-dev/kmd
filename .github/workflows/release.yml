name: Release

# Tests run on every push to main and on pull requests, so a regression is
# caught long before release. Building and publishing happen only for a tag,
# and only after the tests pass.
on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # Catches version drift across the 13 places a version lives while
      # working on main, rather than at tag time when a release is in flight.
      - name: Check version consistency
        run: npm run bump:check

      - name: Build client
        shell: bash
        run: bash build-client.sh

      - name: Unit tests
        run: cargo test

      # The e2e suite drives the real binary, so it needs a release build.
      - name: Build binary
        run: cargo build --release

      - name: Install Playwright browser
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  build:
    # Only tags publish; pushes to main and PRs stop after `test`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            npm-pkg: kmd-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            npm-pkg: kmd-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm-pkg: kmd-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            npm-pkg: kmd-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm-pkg: kmd-win32-x64

    runs-on: ${{ matrix.os }}
    # This job only produces artifacts. Nothing here can reach npm, which is
    # what makes a partial release impossible.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build client
        run: |
          npm install
          bash build-client.sh

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p npm/${{ matrix.npm-pkg }}/bin
          cp target/${{ matrix.target }}/release/kmd \
             npm/${{ matrix.npm-pkg }}/bin/kmd
          chmod +x npm/${{ matrix.npm-pkg }}/bin/kmd

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p npm/${{ matrix.npm-pkg }}/bin
          cp target/${{ matrix.target }}/release/kmd.exe \
             npm/${{ matrix.npm-pkg }}/bin/kmd.exe

      - name: Verify version matches tag
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./npm/${{ matrix.npm-pkg }}/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm-pkg }}
          path: npm/${{ matrix.npm-pkg }}/bin/
          if-no-files-found: error

  # Every package publishes from this one job, only after all five binaries
  # built. Previously each matrix job built *and* published, so macOS could
  # reach npm before Linux had finished compiling — which is how 0.1.2 shipped
  # three platforms of five, and 0.1.5 shipped all five platforms with no meta
  # package. Those versions are unusable and unfixable; npm's unpublish window
  # is 72 hours.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for GitHub Release
      id-token: write  # Required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: dist-bins

      - name: Stage binaries into their packages
        run: |
          set -euo pipefail
          for pkg in kmd-darwin-arm64 kmd-darwin-x64 kmd-linux-x64 kmd-linux-arm64 kmd-win32-x64; do
            mkdir -p "npm/$pkg/bin"
            cp -r "dist-bins/$pkg/." "npm/$pkg/bin/"
          done
          # Artifact upload/download does not preserve the executable bit, and
          # npm stores file modes in the tarball — without this the installed
          # binary is not executable on Linux or macOS.
          chmod +x npm/kmd-darwin-arm64/bin/kmd \
                   npm/kmd-darwin-x64/bin/kmd \
                   npm/kmd-linux-x64/bin/kmd \
                   npm/kmd-linux-arm64/bin/kmd
          ls -l npm/*/bin/

      - name: Verify every package matches the tag
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FAILED=0
          for pkg in kmd kmd-darwin-arm64 kmd-darwin-x64 kmd-linux-x64 kmd-linux-arm64 kmd-win32-x64; do
            PKG_VERSION=$(node -p "require('./npm/$pkg/package.json').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$pkg is $PKG_VERSION, tag is $TAG_VERSION"
              FAILED=1
            fi
          done
          # The meta package's optionalDependencies must point at this release,
          # or `npm i @getforma/kmd` resolves binaries from an older version.
          for dep in $(node -p "Object.values(require('./npm/kmd/package.json').optionalDependencies).join('\n')"); do
            if [ "$dep" != "$TAG_VERSION" ]; then
              echo "::error::meta optionalDependencies pins $dep, tag is $TAG_VERSION"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Copy README into npm package
        run: cp README.md npm/kmd/README.md

      # Trusted publishing: uses OIDC for auth, no npm token needed.
      # Provenance is generated automatically.
      # Configure at: npmjs.com → package Settings → Trusted Publisher
      #
      # Publishing is idempotent: a version already on npm is skipped rather
      # than failing with a 403. That lets a re-run finish a release that died
      # partway instead of dead-ending, which is what forced the 0.1.5 -> 0.1.6
      # bump. The meta package goes last, so it never advertises platform
      # packages that are not on the registry yet.
      - name: Publish
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in kmd-darwin-arm64 kmd-darwin-x64 kmd-linux-x64 kmd-linux-arm64 kmd-win32-x64 kmd; do
            if npm view "@getforma/$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "@getforma/$pkg@$VERSION already published — skipping"
              continue
            fi
            echo "Publishing @getforma/$pkg@$VERSION"
            ( cd "npm/$pkg" && npm publish --access public --provenance )
          done

      - name: Confirm every package is live
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in kmd kmd-darwin-arm64 kmd-darwin-x64 kmd-linux-x64 kmd-linux-arm64 kmd-win32-x64; do
            if npm view "@getforma/$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "ok  @getforma/$pkg@$VERSION"
            else
              echo "::error::@getforma/$pkg@$VERSION is missing from the registry"
              exit 1
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
